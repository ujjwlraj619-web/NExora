<!doctype html><html lang="en" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Nexora Analytics</title><meta name="description" content="Nexora Analytics shows traffic, conversions and revenue in one clear dashboard."><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%234338ca'/%3E%3Cpath d='M9 23V9l14 14V9' fill='none' stroke='%23fff' stroke-width='3' stroke-linecap='round' stroke-linejoin='round'/%3E%3Ccircle cx='23' cy='9' r='2.8' fill='%232dd4bf'/%3E%3C/svg%3E">
<style>
:root{--p:#4338ca;--pt:#fff;--p2:#eef0ff;--bg:#f6f7fb;--c:#fff;--tx:#0f1b3d;--mu:#5b6785;--bd:#e3e7f0;--ok:#15803d;--okb:#dcfce7;--wn:#b45309;--wnb:#fef3c7;--er:#b91c1c;--r:10px;color-scheme:light}
[data-theme=dark]{--p:#a5b4fc;--pt:#0b1020;--p2:#1d2650;--bg:#0b1020;--c:#121a33;--tx:#e8ecfa;--mu:#9aa6c7;--bd:#263256;--ok:#4ade80;--okb:#12341f;--wn:#fbbf24;--wnb:#3a2a0a;--er:#f87171;color-scheme:dark}
*{box-sizing:border-box}body{margin:0;font:16px/1.55 "Avenir Next","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--tx)}
h1,h2,h3{line-height:1.15;margin:0 0 .5em;letter-spacing:-.02em}h1{font-size:clamp(2rem,5vw,3.3rem)}h2{font-size:clamp(1.5rem,3vw,2.1rem)}h3{font-size:1.1rem}
a{color:inherit}:focus-visible{outline:3px solid var(--p);outline-offset:2px}svg{width:100%;height:auto;display:block}
.skip{position:absolute;left:-999px}.skip:focus{left:8px;top:8px;z-index:99;background:var(--c);padding:8px}
.w{max-width:1120px;margin:0 auto;padding:0 20px}.sec{padding:56px 0}.grid{display:grid;gap:16px}.g4{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}.g3{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.row{display:flex;gap:12px;flex-wrap:wrap;align-items:center}.mu{color:var(--mu)}.s{font-size:.85rem}.lead{font-size:1.15rem;color:var(--mu);max-width:56ch}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:44px;padding:8px 16px;border-radius:8px;border:1px solid var(--bd);background:var(--c);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;text-decoration:none}.btn:hover{border-color:var(--p)}.btn.p{background:var(--p);color:var(--pt);border-color:var(--p)}
.card{background:var(--c);border:1px solid var(--bd);border-radius:var(--r);padding:20px;min-width:0}.kv{font-size:1.8rem;font-weight:700;letter-spacing:-.02em}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.8rem;font-weight:600;background:var(--p2);color:var(--p)}.chip.ok{background:var(--okb);color:var(--ok)}.chip.wn{background:var(--wnb);color:var(--wn)}
.ban{background:var(--p2);text-align:center;padding:6px 12px;font-size:.85rem}
header.top{position:sticky;top:0;z-index:10;background:var(--c);border-bottom:1px solid var(--bd)}header .w{display:flex;align-items:center;gap:16px;min-height:64px;position:relative}.logo{font-weight:800;text-decoration:none;font-size:1.2rem;display:flex;gap:8px;align-items:center}.logo{letter-spacing:-.03em}.logo svg{width:30px;height:30px;flex:none}
#nav{display:flex;gap:6px;align-items:center;margin-left:auto}#nav a:not(.btn){padding:10px;text-decoration:none;font-weight:500}#nav a[aria-current]{color:var(--p);font-weight:700}.mm{display:none;margin-left:auto}
.hero{display:grid;grid-template-columns:1fr 1fr;gap:32px;align-items:center;padding:56px 20px}
.app{display:grid;grid-template-columns:240px 1fr;min-height:100vh}.side{background:var(--c);border-right:1px solid var(--bd);padding:16px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:4px}.side a{padding:10px 12px;border-radius:8px;text-decoration:none;font-weight:500}.side a[aria-current]{background:var(--p2);color:var(--p);font-weight:700}.side a:hover{background:var(--bg)}
main{padding:20px;min-width:0;display:flex;flex-direction:column;gap:16px}.bar{display:flex;gap:12px;align-items:center;flex-wrap:wrap}.bar h1{font-size:1.5rem;margin:0}.grow{flex:1}.dm,.scrim{display:none}
select,input[type=search],input[type=text],input[type=email],textarea{font:inherit;padding:9px 10px;border:1px solid var(--bd);border-radius:8px;background:var(--c);color:var(--tx);min-height:44px;width:100%}label{display:grid;gap:4px;font-weight:600;font-size:.9rem}.bar label,.tools label{width:auto;min-width:150px}
.tools{display:flex;gap:12px;flex-wrap:wrap;align-items:end;margin-bottom:12px}.tools label:first-child{flex:1}.sc{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px}th,td{padding:10px 12px;border-bottom:1px solid var(--bd);text-align:left;white-space:nowrap}.n{text-align:right}th button{all:unset;cursor:pointer;font-weight:700;color:var(--mu)}th button:focus-visible{outline:3px solid var(--p)}
.bars{display:grid;gap:10px}.bl{display:flex;justify-content:space-between;font-size:.9rem}.bt{height:10px;border-radius:5px;background:var(--p2)}.bt i{display:block;height:100%;border-radius:5px;background:var(--p)}
.err{color:var(--er);font-size:.85rem;min-height:1.2em}pre{background:var(--bg);padding:12px;border-radius:8px;overflow-x:auto;font-size:.8rem}
.price{font-size:2.4rem;font-weight:800}.pl{list-style:none;padding:0;margin:12px 0;display:grid;gap:6px}.pl li:before{content:"✓ ";color:var(--ok);font-weight:700}
details{border-bottom:1px solid var(--bd);padding:14px 0}summary{cursor:pointer;font-weight:600}
dialog{border:1px solid var(--bd);border-radius:12px;background:var(--c);color:var(--tx);width:min(720px,94vw);padding:20px}dialog::backdrop{background:#0009}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:8px;z-index:50;display:none}#toast.on{display:block}
footer{border-top:1px solid var(--bd);background:var(--c);padding:32px 0}footer a{display:block;padding:4px 0;color:var(--mu);text-decoration:none}
@media(max-width:899px){.app{display:block}.side{position:fixed;inset:0 auto 0 0;width:260px;z-index:30;transform:translateX(-100%);transition:transform .2s}body.nav-open .side{transform:none}body.nav-open .scrim{display:block;position:fixed;inset:0;background:#0008;z-index:20}.dm{display:inline-flex}.hero{grid-template-columns:1fr}}
@media(max-width:760px){.mm{display:inline-flex}#nav{display:none;position:absolute;top:100%;left:0;right:0;flex-direction:column;align-items:stretch;background:var(--c);padding:12px 20px;border-bottom:1px solid var(--bd)}body.nav-open #nav{display:flex}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style><link rel="icon" type="image/png" href="nexora-logo-32.png"></head><body>
<a class="skip" href="#main" onclick="event.preventDefault();document.getElementById('main').focus()">Skip to content</a><div id="app"></div>
<dialog id="dlg" aria-labelledby="dt"><div id="dc"></div></dialog><div id="toast" role="status" aria-live="polite"></div>
<script>
const $=(s,e=document)=>e.querySelector(s),$$=(s,e=document)=>[...e.querySelectorAll(s)];
const fm=n=>Math.round(n).toLocaleString('en-US'),fd=n=>'$'+fm(n),fp=n=>(n*100).toFixed(2)+'%',MN='Jan Feb Mar Apr May Jun Jul Aug Sep Oct Nov Dec'.split(' '),ld=d=>MN[+d.slice(5,7)-1]+' '+(+d.slice(8));
/* ---- sample data: one seeded dataset feeds every chart, table and total ---- */
let seed=11;const rnd=()=>(seed=seed*16807%2147483647)/2147483647;
const SRC=[['Organic search / organic',.38],['Direct / none',.24],['Google / cpc',.16],['Newsletter / email',.12],['Social / referral',.10]];
const PG=[['/',.28],['/shop/new-arrivals',.2],['/shop/sale',.16],['/blog/care-guide',.14],['/shop/linen-shirts',.12],['/about',.10]];
const pick=L=>{let r=rnd(),a=0;for(const x of L){a+=x[1];if(r<a)return x[0]}return L.at(-1)[0]};
const N=180,D=[],O=[],E=Date.UTC(2026,9,12);
for(let i=0;i<N;i++){const t=new Date(E-(N-1-i)*864e5),wd=t.getUTCDay();
const s=Math.round((560+i*1.8+90*Math.sin(i/8))*(wd%6?1:.78)*(.94+rnd()*.12)),o=Math.round(s*(.027+.004*Math.sin(i/21))*(.9+rnd()*.2));
const d={i,date:t.toISOString().slice(0,10),s,v:Math.round(s*.79),o,rev:0};
for(let k=0;k<o;k++){const a=Math.round(18+rnd()*rnd()*260),st=rnd()<.04?'Refunded':'Paid';O.push({di:i,id:'NX-'+(10001+O.length),date:d.date,src:pick(SRC),pg:pick(PG),amt:a,st});if(st=='Paid')d.rev+=a}D.push(d)}
const win=n=>[D.slice(N-n),D.slice(N-2*n,N-n)],sum=(a,k)=>a.reduce((x,d)=>x+d[k],0),tot=a=>{const s=sum(a,'s'),o=sum(a,'o');return{v:sum(a,'v'),s,o,rate:o/s,rev:sum(a,'rev')}},ord=n=>O.filter(o=>o.di>=N-n);
const alloc=(L,t)=>{let u=0;return L.map((x,i)=>{if(i<L.length-1){const v=Math.round(t*x[1]);u+=v;return v}return t-u})};
const grp=(L,key,n,lab)=>{const a=alloc(L,tot(win(n)[0]).s),od=ord(n);return{h:[lab,'Sessions','Orders','Conv. rate','Revenue'],f:[0,fm,fm,fp,fd],r:L.map((x,i)=>{const q=od.filter(o=>o[key]==x[0]);return[x[0],a[i],q.length,q.length/a[i],q.filter(o=>o.st=='Paid').reduce((s,o)=>s+o.amt,0)]})}};
const REP={src:n=>grp(SRC,'src',n,'Source / medium'),pg:n=>grp(PG,'pg',n,'Landing page'),ord:n=>({h:['Order','Date','Source / medium','Landing page','Amount','Status'],f:[0,0,0,0,fd,0],r:ord(n).map(o=>[o.id,o.date,o.src,o.pg,o.amt,o.st])}),day:n=>({h:['Date','Sessions','Orders','Revenue'],f:[0,fm,fm,fd],r:D.slice(N-n).map(d=>[d.date,d.s,d.o,d.rev])})};
const REPS=[['src','Traffic sources','Traffic'],['pg','Landing page conversions','Traffic'],['ord','Order log','Revenue'],['day','Daily performance summary','Summary']];
const LOGO=`<svg viewBox="0 0 32 32" aria-hidden="true"><rect width="32" height="32" rx="8" fill="var(--p)"/><path d="M9 23V9l14 14V9" fill="none" stroke="var(--pt)" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="23" cy="9" r="2.8" fill="#2dd4bf"/></svg>`;
/* ---- state ---- */
const S={range:30,yr:0},T={},RP={q:'',t:''};let P={name:'Alex Morgan',email:'alex@harborpine.example',role:'Owner',n:{weekly:1,traffic:1,revenue:0}};
const theme=t=>{document.documentElement.dataset.theme=t;try{localStorage.setItem('nx-theme',t)}catch(e){}};
try{theme(localStorage.getItem('nx-theme')||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'))}catch(e){}
const toast=m=>{const t=$('#toast');t.textContent=m;t.className='on';clearTimeout(toast.h);toast.h=setTimeout(()=>t.className='',3500)};
/* ---- charts ---- */
function line(v,lab,fmt,name,col='var(--p)'){const W=640,H=220,L=50,B=28,Tp=10,R=10,mx=Math.max(...v)*1.1||1,x=i=>L+i*(W-L-R)/(v.length-1||1),y=a=>Tp+(H-Tp-B)*(1-a/mx);let g='';
for(let k=0;k<=4;k++){const yy=y(mx*k/4);g+=`<line x1="${L}" x2="${W-R}" y1="${yy}" y2="${yy}" stroke="var(--bd)"/><text x="${L-6}" y="${yy+4}" text-anchor="end" fill="var(--mu)" font-size="11">${fmt(mx*k/4)}</text>`}
const pts=v.map((a,i)=>x(i)+','+y(a)).join(' '),mi=v.indexOf(Math.max(...v)),w=(W-L-R)/v.length;
return `<svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${name}: starts at ${fmt(v[0])}, ends at ${fmt(v.at(-1))}, peak ${fmt(v[mi])} on ${lab[mi]}">${g}<polygon points="${L},${H-B} ${pts} ${x(v.length-1)},${H-B}" fill="${col}" opacity=".1"/><polyline points="${pts}" fill="none" stroke="${col}" stroke-width="2" stroke-linejoin="round"/><text x="${L}" y="${H-8}" fill="var(--mu)" font-size="11">${lab[0]}</text><text x="${(L+W-R)/2}" y="${H-8}" text-anchor="middle" fill="var(--mu)" font-size="11">${lab[v.length>>1]}</text><text x="${W-R}" y="${H-8}" text-anchor="end" fill="var(--mu)" font-size="11">${lab.at(-1)}</text>${v.map((a,i)=>`<rect x="${x(i)-w/2}" y="${Tp}" width="${w}" height="${H-B-Tp}" fill="transparent"><title>${lab[i]}: ${fmt(a)}</title></rect>`).join('')}</svg>`}
const bars=r=>{const m=Math.max(...r.map(a=>a[1]));return `<div class="bars">${r.map(a=>`<div><div class="bl"><span>${a[0]}</span><b>${a[2]}</b></div><div class="bt"><i style="width:${a[1]/m*100}%"></i></div></div>`).join('')}</div>`};
const trend=(n,k,fmt,name,col)=>{const d=D.slice(N-n);return line(d.map(x=>k=='rate'?x.o/x.s:x[k]),d.map(x=>ld(x.date)),fmt,name,col)};
function kpis(n){const[c,p]=win(n),a=tot(c),b=tot(p);return `<div class="grid g4">${[['Visitors',fm(a.v),a.v/b.v],['Sessions',fm(a.s),a.s/b.s],['Conversion rate',fp(a.rate),a.rate/b.rate],['Revenue',fd(a.rev),a.rev/b.rev]].map(([l,v,d])=>`<div class="card"><div class="mu">${l}</div><div class="kv">${v}</div><span class="chip ${d>=1?'ok':'wn'}">${d>=1?'▲ +':'▼ −'}${Math.abs((d-1)*100).toFixed(1)}%</span> <span class="mu s">vs previous ${n} days</span></div>`).join('')}</div>`}
/* ---- tables ---- */
const badge=s=>`<span class="chip ${s=='Paid'?'ok':'wn'}">${s}</span>`;
function rows(id){const t=T[id],R=REP[id](S.range);let r=R.r.filter(a=>!t.q||a.some(c=>String(c).toLowerCase().includes(t.q.toLowerCase()))).filter(a=>!t.s||a[5]==t.s);
r.sort((a,b)=>(typeof a[t.k]=='number'?a[t.k]-b[t.k]:String(a[t.k]).localeCompare(b[t.k]))*t.d);return{...R,r}}
function fill(id){const t=T[id],R=rows(id),b=$('#tb-'+id);if(!b)return;
b.innerHTML=R.r.length?R.r.slice(0,20).map(r=>`<tr>${r.map((c,i)=>`<td${R.f[i]?' class="n"':''}>${R.f[i]?R.f[i](c):id=='ord'&&i==5?badge(c):c}</td>`).join('')}</tr>`).join(''):`<tr><td colspan="${R.h.length}">No rows match your filters. Clear the search or pick a longer date range.</td></tr>`;
$('#ct-'+id).textContent=`Showing ${Math.min(20,R.r.length)} of ${R.r.length} rows in the last ${S.range} days`;
$$(`[data-sort^="${id}:"]`).forEach(b=>{const i=+b.dataset.sort.split(':')[1];b.parentNode.setAttribute('aria-sort',t.k==i?(t.d>0?'ascending':'descending'):'none');b.textContent=R.h[i]+(t.k==i?(t.d>0?' ▲':' ▼'):'')})}
function table(id,label){const t=T[id]||(T[id]={q:'',k:id=='ord'||id=='day'?(id=='ord'?1:0):1,d:-1,s:''}),R=REP[id](S.range);
return `<div class="card"><div class="tools"><label>Search<input type="search" data-q="${id}" value="${t.q}" placeholder="Filter rows"></label>${id=='ord'?`<label>Status<select data-flt="${id}"><option value="">All</option><option>Paid</option><option>Refunded</option></select></label>`:''}<button class="btn" data-csv="${id}">Export CSV</button></div><div class="sc" tabindex="0" role="region" aria-label="${label}"><table><thead><tr>${R.h.map((h,i)=>`<th${R.f[i]?' class="n"':''}><button data-sort="${id}:${i}">${h}</button></th>`).join('')}</tr></thead><tbody id="tb-${id}"></tbody></table></div><p class="mu s" id="ct-${id}" aria-live="polite"></p></div>`}
const csv=(h,r)=>[h,...r].map(a=>a.map(c=>`"${String(typeof c=='number'&&!Number.isInteger(c)?+c.toFixed(4):c).replace(/"/g,'""')}"`).join(',')).join('\n');
async function save(name,text){const blob=new Blob([text],{type:'text/csv'});let d=null;try{d=await claude.use('downloads')}catch(e){}
if(d){try{await d.save({filename:name,data:blob});toast('Saved '+name)}catch(e){toast(e.code=='declined'?'Download cancelled.':'Could not save the file. Try again.')}return}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;a.click();toast('Downloaded '+name)}
const exp=id=>{const R=id in T?rows(id):REP[id](S.range);save(`nexora-${id}-last-${S.range}-days.csv`,csv(R.h,R.r))};
/* ---- marketing sections ---- */
const F=[['Website traffic','See visits rise and fall by day, with the peak called out.',()=>trend(30,'v',fm,'Visits, last 30 days')],['Acquisition channels','Find out which sources bring the most sessions.',()=>{const r=REP.src(30);return bars(r.r.map(a=>[a[0],a[1],fm(a[1])]))}],['Conversion tracking','Compare landing pages by how often visits become orders.',()=>{const r=REP.pg(30);return bars(r.r.map(a=>[a[0],a[3],fp(a[3])]))}],['Revenue reports',`Track paid revenue; refunds are left out.`,()=>trend(30,'rev',fd,'Revenue, last 30 days','#0f766e')],['Campaign performance','Compare paid, email and social side by side.',()=>{const r=REP.src(30);return `<div class="sc"><table><tr><th>Source</th><th class="n">Orders</th><th class="n">Revenue</th></tr>${r.r.slice(2).map(a=>`<tr><td>${a[0]}</td><td class="n">${a[2]}</td><td class="n">${fd(a[4])}</td></tr>`).join('')}</table></div>`}],['Downloadable reports','Export any report to CSV for your own spreadsheets.',()=>`<pre>${csv(REP.ord(30).h,REP.ord(30).r.slice(0,3))}</pre>`]];
const feats=n=>`<div class="grid g2">${F.slice(0,n).map(f=>`<div class="card"><h3>${f[0]}</h3><p class="mu">${f[1]}</p>${f[2]()}</div>`).join('')}</div>`;
const PL=[['Starter',19,'For a first online shop',['10,000 sessions a month','1 team seat','6 months of history','CSV exports']],['Growth',49,'For teams running campaigns',['100,000 sessions a month','5 team seats','24 months of history','Scheduled reports']],['Business',129,'For agencies and larger shops',['1,000,000 sessions a month','Unlimited seats','60 months of history','Priority support']]];
const pricing=()=>`<div class="row" style="margin-bottom:16px"><button class="btn" role="switch" aria-checked="${!!S.yr}" data-bill>${S.yr?'Billed yearly (20% off)':'Billed monthly'}: switch</button><span class="chip wn">Illustrative prices</span></div><div class="grid g3">${PL.map((p,i)=>`<div class="card"><h3>${p[0]} ${i==1?'<span class="chip">Most chosen</span>':''}</h3><p class="mu">${p[2]}</p><div><span class="price" data-pm="${p[1]}">$${S.yr?Math.round(p[1]*.8):p[1]}</span> <span class="mu">/month</span></div><ul class="pl">${p[3].map(x=>`<li>${x}</li>`).join('')}</ul><a class="btn ${i==1?'p':''}" href="#/dash">Try the demo</a></div>`).join('')}</div>`;
const FAQ=[['Is this connected to real data?','No. Nexora is a fictional product and every number comes from one generated sample dataset.'],['Can I try the dashboard?','Yes. Open the demo dashboard and change the date range, search tables, sort columns and export CSV files.'],['Do the prices mean anything?','They are illustrative for this portfolio demo. Nothing can be bought.'],['Is there a login?','No. There are no accounts, and no information you enter leaves this page.']];
const faq=()=>FAQ.map(q=>`<details><summary>${q[0]}</summary><p class="mu">${q[1]}</p></details>`).join('');
const home=()=>`<section class="w hero"><div><h1>Know which visits turn into sales.</h1><p class="lead">Nexora Analytics puts traffic, sources, conversions and revenue on one screen, so a small team can decide what to do next without an analyst.</p><div class="row"><a class="btn p" href="#/dash">Open the demo dashboard</a><a class="btn" href="#/pricing">See pricing</a></div><p class="mu s">Fictional product with sample data. Nothing is connected to a real analytics service.</p></div><div class="card" role="group" aria-label="Dashboard preview">${kpis(30)}<h3 style="margin-top:16px">Visits, last 30 days</h3>${trend(30,'v',fm,'Visits, last 30 days')}</div></section>
<section class="w sec"><div class="grid g2"><div class="card"><h3>Without Nexora</h3><p class="mu">Traffic is in one tab, orders in another and ad spend in a spreadsheet. Nobody agrees which number is right.</p></div><div class="card"><h3>With Nexora</h3><p class="mu">One dataset feeds every chart and table, so totals always match and you can see what changed since last period.</p></div></div></section>
<section class="w sec"><h2>What you can see</h2>${feats(4)}<p><a href="#/features">Explore all features</a></p></section>
<section class="w sec"><h2>How it works</h2><ol class="grid g3" style="padding:0;list-style:none"><li class="card"><h3>1. Add the snippet</h3><p class="mu">Paste one script on your site.</p></li><li class="card"><h3>2. Pick a date range</h3><p class="mu">Compare any period with the one before it.</p></li><li class="card"><h3>3. Act on what changed</h3><p class="mu">Double down on the sources and pages that earn revenue.</p></li></ol></section>
<section class="w sec"><h2>Pricing</h2>${pricing()}</section><section class="w sec"><h2>Questions</h2>${faq()}</section>`;
const contact=()=>`<form id="contact" class="card" novalidate><h3>Contact</h3><label>Name<input type="text" name="n" autocomplete="name"></label><div class="err" id="e-n"></div><label>Email<input type="email" name="e" autocomplete="email"></label><div class="err" id="e-e"></div><label>Message<textarea name="m" rows="4"></textarea></label><div class="err" id="e-m"></div><button class="btn p" type="submit">Send message</button><p class="s mu" id="cf" role="status"></p></form>`;
const PAGES={'':['Nexora Analytics: simple analytics for small businesses','Understand traffic, conversions and revenue in one clear dashboard.',home],
features:['Features | Nexora Analytics','Traffic, channels, conversions, revenue, campaigns and exports.',()=>`<section class="w sec"><h1>Every metric on one page</h1><p class="lead">Each example below uses the same demo dataset as the dashboard.</p>${feats(6)}</section>`],
pricing:['Pricing | Nexora Analytics','Three illustrative plans: Starter, Growth and Business.',()=>`<section class="w sec"><h1>Pricing</h1><p class="lead">Illustrative prices for a portfolio demo. Nothing can be purchased.</p>${pricing()}<h2 style="margin-top:40px">Compare plans</h2><div class="card sc"><table><tr><th>Limit</th>${PL.map(p=>`<th>${p[0]}</th>`).join('')}</tr>${[0,1,2,3].map(i=>`<tr><td>${['Sessions','Seats','History','Extras'][i]}</td>${PL.map(p=>`<td>${p[3][i]}</td>`).join('')}</tr>`).join('')}</table></div></section>`],
about:['About and contact | Nexora Analytics','Nexora is a fictional company built as a portfolio demo.',()=>`<section class="w sec"><h1>About Nexora</h1><p class="lead">Our mission, in this story: make analytics clear enough for a shop owner to use in five minutes.</p><div class="card" style="margin:16px 0"><h3>Portfolio demo notice</h3><p class="mu">Nexora is a fictional company. All data is generated sample data, prices are illustrative, and nothing here is connected to a backend, login or payment system.</p></div><div class="grid g2"><div class="card"><h3>Company background</h3><p class="mu">A fictional product studio created to show UI design, frontend architecture and data visualization in one coherent product.</p></div>${contact()}</div></section>`]};
const DT={dash:['Overview','Visitors, sessions, conversion rate and revenue for the selected period.'],'dash/traffic':['Traffic','Visits, sources and landing pages.'],'dash/revenue':['Revenue and conversions','Orders, conversion rate and paid revenue.'],'dash/reports':['Reports','Preview and export sample reports.'],'dash/settings':['Settings','Profile, theme and notifications.']};
const dashHtml={
dash:()=>{const g=REP.pg(S.range),s=REP.src(S.range);return `${kpis(S.range)}<div class="grid g2"><div class="card"><h3>Visits</h3>${trend(S.range,'v',fm,'Visits')}</div><div class="card"><h3>Revenue</h3>${trend(S.range,'rev',fd,'Revenue','#0f766e')}</div><div class="card"><h3>Traffic sources</h3>${bars(s.r.map(a=>[a[0],a[1],fm(a[1])+' sessions']))}</div><div class="card"><h3>Top landing pages</h3><div class="sc"><table><tr><th>Page</th><th class="n">Sessions</th><th class="n">Conv. rate</th></tr>${[...g.r].sort((a,b)=>b[1]-a[1]).slice(0,5).map(a=>`<tr><td>${a[0]}</td><td class="n">${fm(a[1])}</td><td class="n">${fp(a[3])}</td></tr>`).join('')}</table></div></div></div><div class="card"><h3>Recent activity</h3><ul class="pl" style="margin:0">${O.slice(-6).reverse().map(o=>`<li>${o.id}: ${fd(o.amt)} from ${o.src} on ${ld(o.date)} (${o.st})</li>`).join('')}</ul></div>`},
'dash/traffic':()=>`<div class="card"><h3>Visits over time</h3>${trend(S.range,'v',fm,'Visits')}</div><div class="card"><h3>Source and medium</h3>${bars(REP.src(S.range).r.map(a=>[a[0],a[1],fm(a[1])]))}</div>${table('pg','Landing pages')}`,
'dash/revenue':()=>{const a=tot(win(S.range)[0]);return `<div class="grid g3"><div class="card"><div class="mu">Revenue</div><div class="kv">${fd(a.rev)}</div><p class="s mu">Sum of paid orders. Refunded orders are excluded.</p></div><div class="card"><div class="mu">Orders</div><div class="kv">${fm(a.o)}</div><p class="s mu">All orders placed, including later refunds.</p></div><div class="card"><div class="mu">Conversion rate</div><div class="kv">${fp(a.rate)}</div><p class="s mu">Orders divided by sessions.</p></div></div><div class="grid g2"><div class="card"><h3>Revenue per day</h3>${trend(S.range,'rev',fd,'Revenue','#0f766e')}</div><div class="card"><h3>Conversion rate per day</h3>${trend(S.range,'rate',fp,'Conversion rate')}</div></div>${table('ord','Orders')}`},
'dash/reports':()=>`<div class="card"><div class="tools"><label>Search reports<input type="search" id="rq" value="${RP.q}"></label><label>Type<select id="rt"><option value="">All</option><option>Traffic</option><option>Revenue</option><option>Summary</option></select></label></div><div id="rl"></div></div>`,
'dash/settings':()=>`<form id="settings" class="card" novalidate style="max-width:560px"><h3>Profile</h3><label>Full name<input type="text" name="n" value="${P.name}"></label><div class="err" id="e-n"></div><label>Work email<input type="email" name="e" value="${P.email}"></label><div class="err" id="e-e"></div><label>Role<select name="r">${['Owner','Marketer','Agency'].map(x=>`<option${P.role==x?' selected':''}>${x}</option>`).join('')}</select></label><fieldset style="border:0;padding:0;margin:12px 0"><legend><b>Theme</b></legend><label style="display:inline-flex;gap:6px;margin-right:16px"><input type="radio" name="t" value="light"${document.documentElement.dataset.theme=='light'?' checked':''}>Light</label><label style="display:inline-flex;gap:6px"><input type="radio" name="t" value="dark"${document.documentElement.dataset.theme=='dark'?' checked':''}>Dark</label></fieldset><fieldset style="border:0;padding:0"><legend><b>Notifications</b></legend>${[['weekly','Weekly summary email'],['traffic','Traffic spike alerts'],['revenue','Revenue drop alerts']].map(a=>`<label style="display:flex;gap:8px;align-items:center;font-weight:400"><input type="checkbox" name="${a[0]}"${P.n[a[0]]?' checked':''}>${a[1]}</label>`).join('')}</fieldset><div class="row" style="margin-top:16px"><button class="btn p" type="submit">Save changes</button><button class="btn" type="button" data-cancel>Cancel</button></div><p class="s" id="sf" role="status"></p></form>`};
function repList(){const l=REPS.filter(r=>r[1].toLowerCase().includes(RP.q.toLowerCase())&&(!RP.t||r[2]==RP.t));$('#rl').innerHTML=l.length?`<div class="grid">${l.map(r=>`<div class="row card"><div class="grow"><b>${r[1]}</b><div class="mu s">${r[2]} report, last ${S.range} days</div></div><button class="btn" data-prev="${r[0]}">Preview</button><button class="btn" data-csv="${r[0]}">Export CSV</button></div>`).join('')}</div>`:`<p>No reports match. Clear the search or choose another type.</p>`}
function render(){const k=location.hash.replace(/^#\/?/,''),dash=k.startsWith('dash'),key=dash?(dashHtml[k]?k:'dash'):(PAGES[k]?k:'');document.body.classList.remove('nav-open');let h,t,d;
if(dash){[t,d]=DT[key];h=`<div class="app"><aside class="side" aria-label="Dashboard"><a class="logo" href="#/">${LOGO}Nexora</a><p class="s mu">Demo workspace: Harbor &amp; Pine</p>${Object.keys(DT).map(x=>`<a href="#/${x}"${x==key?' aria-current="page"':''}>${DT[x][0]}</a>`).join('')}<div class="grow"></div><a href="#/">Back to website</a><p class="s mu">Portfolio demo: fictional data.</p></aside><div class="scrim" data-menu></div><main id="main" tabindex="-1"><div class="bar"><button class="btn dm" data-menu aria-label="Open navigation">Menu</button><h1>${t}</h1><div class="grow"></div>${key=='dash/settings'?'':`<label class="s">Date range<select id="range">${[7,30,90].map(n=>`<option value="${n}"${S.range==n?' selected':''}>Last ${n} days</option>`).join('')}</select></label>`}<button class="btn" data-tt aria-pressed="${document.documentElement.dataset.theme=='dark'}">Dark mode</button></div>${dashHtml[key]()}</main></div>`;t+=' | Nexora Analytics'}
else{[t,d]=PAGES[key];const nav=[['features','Features'],['pricing','Pricing'],['about','About and contact']];h=`<div class="ban">Portfolio demo: fictional company, illustrative data.</div><header class="top"><div class="w"><a class="logo" href="#/">${LOGO}Nexora</a><button class="btn mm" data-menu aria-label="Toggle menu">Menu</button><nav id="nav" aria-label="Main">${nav.map(n=>`<a href="#/${n[0]}"${n[0]==key?' aria-current="page"':''}>${n[1]}</a>`).join('')}<button class="btn" data-tt aria-pressed="${document.documentElement.dataset.theme=='dark'}">Dark mode</button><a class="btn p" href="#/dash">Demo dashboard</a></nav></div></header><main id="main" tabindex="-1" style="padding:0">${PAGES[key][2]()}</main><footer><div class="w grid g3"><div><span class="logo">${LOGO}Nexora Analytics</span><p class="s mu">A fictional product. Sample data only.</p></div><div><b>Product</b><a href="#/features">Features</a><a href="#/pricing">Pricing</a><a href="#/dash">Demo dashboard</a></div><div><b>Company and legal</b><a href="#/about">About and contact</a><a href="#/about">Portfolio demo notice</a></div></div></footer>`;t=PAGES[key][0]}
$('#app').innerHTML=h;document.title=t;$('meta[name=description]').content=d;scrollTo(0,0);Object.keys(T).forEach(i=>$('#tb-'+i)&&fill(i));if($('#rl'))repList();
$$('[data-tt]').forEach(b=>b.textContent=document.documentElement.dataset.theme=='dark'?'Light mode':'Dark mode')}
/* ---- events ---- */
addEventListener('hashchange',render);
addEventListener('keydown',e=>{if(e.key=='Escape')document.body.classList.remove('nav-open')});
document.addEventListener('click',e=>{const t=e.target.closest('[data-menu],[data-tt],[data-sort],[data-csv],[data-bill],[data-prev],[data-close],[data-cancel]');if(!t)return;const d=t.dataset;
if('menu'in d){document.body.classList.toggle('nav-open');$$('[data-menu]').forEach(b=>b.setAttribute('aria-expanded',document.body.classList.contains('nav-open')))}
else if('tt'in d){theme(document.documentElement.dataset.theme=='dark'?'light':'dark');render()}
else if(d.sort){const[id,i]=d.sort.split(':'),s=T[id];s.d=s.k==+i?-s.d:(+i>0&&id!='ord'?-1:1);s.k=+i;fill(id)}
else if(d.csv)exp(d.csv);
else if('bill'in d){S.yr=S.yr?0:1;t.setAttribute('aria-checked',!!S.yr);t.textContent=(S.yr?'Billed yearly (20% off)':'Billed monthly')+': switch';$$('[data-pm]').forEach(p=>p.textContent='$'+(S.yr?Math.round(p.dataset.pm*.8):p.dataset.pm))}
else if(d.prev){const R=REP[d.prev](S.range),n=REPS.find(r=>r[0]==d.prev)[1];$('#dc').innerHTML=`<h2 id="dt" style="font-size:1.3rem">${n}</h2><p class="mu s">Preview of ${Math.min(5,R.r.length)} of ${R.r.length} rows</p><div class="sc"><table><tr>${R.h.map(h=>`<th>${h}</th>`).join('')}</tr>${R.r.slice(0,5).map(r=>`<tr>${r.map((c,i)=>`<td>${R.f[i]?R.f[i](c):c}</td>`).join('')}</tr>`).join('')}</table></div><div class="row" style="margin-top:16px"><button class="btn p" data-csv="${d.prev}">Export CSV</button><button class="btn" data-close>Close</button></div>`;$('#dlg').showModal()}
else if('close'in d)$('#dlg').close();
else if('cancel'in d){render();toast('Changes discarded.')}});
document.addEventListener('input',e=>{const t=e.target;if(t.dataset.q){T[t.dataset.q].q=t.value;fill(t.dataset.q)}else if(t.id=='rq'){RP.q=t.value;repList()}});
document.addEventListener('change',e=>{const t=e.target;if(t.id=='range'){S.range=+t.value;render()}else if(t.dataset.flt){T[t.dataset.flt].s=t.value;fill(t.dataset.flt)}else if(t.id=='rt'){RP.t=t.value;repList()}});
const chk=(f,r)=>{let ok=1;for(const[k,id,fn,msg]of r){const el=f.elements[k],bad=!fn(el.value.trim());$('#'+id).textContent=bad?msg:'';el.setAttribute('aria-invalid',bad);if(bad){ok=0}}return ok};
const em=v=>/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
document.addEventListener('submit',e=>{e.preventDefault();const f=e.target;
if(f.id=='contact'){if(chk(f,[['n','e-n',v=>v.length>1,'Enter your name.'],['e','e-e',em,'Enter a valid email, like name@example.com.'],['m','e-m',v=>v.length>9,'Write at least 10 characters.']])){$('#cf').textContent=`Thanks, ${f.elements.n.value.trim()}. This is a portfolio demo, so nothing was sent.`;f.reset()}else $('#cf').textContent=''}
if(f.id=='settings'){if(chk(f,[['n','e-n',v=>v.length>1,'Enter your full name.'],['e','e-e',em,'Enter a valid email, like name@example.com.']])){P={name:f.elements.n.value.trim(),email:f.elements.e.value.trim(),role:f.elements.r.value,n:{weekly:f.elements.weekly.checked,traffic:f.elements.traffic.checked,revenue:f.elements.revenue.checked}};theme(f.elements.t.value);render();toast('Settings saved.')}else $('#sf').textContent='Fix the highlighted fields and save again.'}});
render();
</script></body></html>
